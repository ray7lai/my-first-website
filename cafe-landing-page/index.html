<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晨光咖啡</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="hero">
    <p class="brand">晨光咖啡</p>
    <h1>一杯咖啡，讓早晨慢下來。</h1>
    <p>藏在台南巷弄裡，提供手沖咖啡與安靜的閱讀時光。</p>
    <a href="#menu">查看今日菜單</a>
  </header>

  <main>
    <section id="menu" class="menu">
      <h2>今日推薦</h2>

      <div class="menu-items">
        <article class="menu-item">
          <h3>招牌拿鐵</h3>
          <p>濃郁咖啡與滑順鮮奶的日常選擇。</p>
          <p class="price">NT$ 120</p>
        </article>

        <article class="menu-item">
          <h3>冰滴咖啡</h3>
          <p>低溫慢萃，帶有清爽果香。</p>
          <p class="price">NT$ 150</p>
        </article>

        <article class="menu-item">
          <h3>巴斯克乳酪蛋糕</h3>
          <p>綿密微焦，適合配一杯熱美式。</p>
          <p class="price">NT$ 130</p>
        </article>
      </div>
    </section>
    <section class="visit">
  <p class="eyebrow">VISIT US</p>
  <h2>來晨光咖啡坐坐</h2>
  <p>台南市中西區咖啡巷 10 號</p>
  <p>週二至週日 10:00–18:00</p>
  <a href="https://maps.google.com" target="_blank">查看地圖</a>
</section>
  </main>
</body>
</html>
